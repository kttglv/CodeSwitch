name: Signed release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_release.py
  macos:
    needs: gate
    environment: release
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Require signing credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/prepare_macos_signing.py
      - name: Sign and notarize
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Updater signing key is missing"; exit 1; }
          npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.release.conf.json
      - name: Verify signature and Gatekeeper assessment
        run: |
          codesign --verify --deep --strict "target/${{ matrix.target }}/release/bundle/macos/CodeSwitch.app"
          spctl --assess --type execute --verbose "target/${{ matrix.target }}/release/bundle/macos/CodeSwitch.app"
      - run: python3 scripts/dependency_notices.py
      - run: python3 scripts/update_manifest.py stage --target ${{ matrix.target }}
      - name: Remove ephemeral signing keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/codeswitch-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/codeswitch-signing.keychain-db"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: codeswitch-signed-${{ matrix.target }}
          path: artifacts/updater/*
          if-no-files-found: error
  windows:
    needs: gate
    runs-on: windows-2025
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Import publisher certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Signing credentials are missing' }
          $pfx = Join-Path $env:RUNNER_TEMP 'codeswitch.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com'; tsp = $true } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'src-tauri/signing.json'
      - name: Build signed installer and updater signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Updater signing key is missing' }
          npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/signing.json --config src-tauri/tauri.release.conf.json
      - name: Verify Authenticode
        shell: pwsh
        run: |
          $files = @('target/x86_64-pc-windows-msvc/release/codeswitch.exe') + @(Get-ChildItem 'target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe' | ForEach-Object FullName)
          foreach ($file in $files) { if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') { throw "Invalid signature: $file" } }
      - run: python scripts/dependency_notices.py
      - run: python scripts/update_manifest.py stage --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: codeswitch-signed-windows-x64
          path: artifacts/updater/*
          if-no-files-found: error
  draft:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: codeswitch-signed-*
          path: artifacts/updater
          merge-multiple: true
      - name: Assemble feed and stage a draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_manifest.py draft
