name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: app,dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python scripts/verify_resources.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/benchmark.py benchmarks/smoke.jsonl benchmarks/smoke-report.json
      - run: npm run bundle:preview -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - run: python scripts/dependency_notices.py
      - uses: actions/upload-artifact@v4
        with:
          name: codeswitch-preview-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debug/bundle/dmg/*.dmg
            target/${{ matrix.target }}/debug/bundle/nsis/*.exe
            artifacts/dependency-notices.json
            benchmarks/smoke-report.json
          if-no-files-found: error
